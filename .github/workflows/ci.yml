name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: Unit tests and fuzz inputs
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: make test
        run: make test

  atari:
    name: Atari build
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: The m68k cross compiler
        run: |
          # On 11 Nov 2026 the runners could not reach azure.archive.ubuntu.com or archive.ubuntu.com:
          # kernel.org's mirror, over https (EPlay's finding), and apt retries
          # (13 Nov 2026: kernel.org's unreachable from the runners in turn: both, the first that answers, and IPv4)
          printf 'http://azure.archive.ubuntu.com/ubuntu\nhttps://mirrors.edge.kernel.org/ubuntu\nhttp://archive.ubuntu.com/ubuntu\n' | sudo tee /etc/apt/apt-mirrors.txt >/dev/null
          sudo apt-get -o Acquire::Retries=3 -o Acquire::ForceIPv4=true update
          sudo apt-get -o Acquire::Retries=3 -o Acquire::ForceIPv4=true install -y gcc-m68k-linux-gnu
      - name: Build the programs
        run: make
      - name: The build changed no tracked file
        run: |
          git status --porcelain
          test -z "$(git status --porcelain)"
