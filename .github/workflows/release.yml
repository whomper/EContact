name: Release

# Builds EContact and publishes it as a GitHub Release: two packages and
# nothing else, econtact-x.y.zip (ST, TT, Falcon) and
# econtact-x.y-firebee.zip (the guidelines, 7.4; decided 22 Nov 2026). Two
# ways to start it:
# - Actions > Release > Run workflow, on main, with the notes: it tags
#   main's commit vX.Y, from VERSION;
# - push a tag vX.Y that matches VERSION: the tag's message
#   (git tag -a) is the notes.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      notes:
        description: "What is new (Markdown): the release's notes"
        required: true
        type: string

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Which release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          V=$(cat VERSION)
          if [ "$GITHUB_REF_TYPE" = tag ]; then
            TAG=$GITHUB_REF_NAME
            if [ "$TAG" != "v$V" ]; then
              echo "::error::tag $TAG, but VERSION says $V"
              exit 1
            fi
          else
            TAG=v$V
            if [ "$GITHUB_REF_NAME" != main ]; then
              echo "::error::run it on main"
              exit 1
            fi
            if git ls-remote --exit-code --tags origin "refs/tags/$TAG" >/dev/null; then
              echo "::error::$TAG is out already: tools/bump.py and commit first"
              exit 1
            fi
          fi
          echo "TAG=$TAG" >> "$GITHUB_ENV"
      - name: Tools
        run: |
          # On 11 Nov 2026 the runners could not reach azure.archive.ubuntu.com or archive.ubuntu.com:
          # kernel.org's mirror, over https (EPlay's finding), and apt retries
          # (13 Nov 2026: kernel.org's unreachable from the runners in turn: both, the first that answers, and IPv4)
          printf 'http://azure.archive.ubuntu.com/ubuntu\nhttps://mirrors.edge.kernel.org/ubuntu\nhttp://archive.ubuntu.com/ubuntu\n' | sudo tee /etc/apt/apt-mirrors.txt >/dev/null
          sudo apt-get -o Acquire::Retries=3 -o Acquire::ForceIPv4=true update
          sudo apt-get -o Acquire::Retries=3 -o Acquire::ForceIPv4=true install -y gcc-m68k-linux-gnu zip autoconf automake libtool gettext autopoint pkg-config
      - name: hcp, for the help file
        run: common/tools/build-hcp.sh "$RUNNER_TEMP/hcp"
      - name: Test
        run: make test
      - name: Build
        run: make dist HCP="$RUNNER_TEMP/hcp/hcp"
      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
          NOTES: ${{ inputs.notes }}
        run: |
          if [ "$GITHUB_REF_TYPE" = tag ]; then
            git fetch -q --force origin "refs/tags/$TAG:refs/tags/$TAG"
            git tag -l --format='%(contents)' "$TAG" > "$RUNNER_TEMP/notes.md"
          else
            printf '%s\n' "$NOTES" > "$RUNNER_TEMP/notes.md"
          fi
          # the FireBee zip first, the standard one last, one upload each, and the order checked
          # (the guidelines, 7.4: every EUpdate up to 2.14 unpacks each zip of a release, the
          # last one winning, so the ST, TT and Falcon one must be last)
          V=$(cat VERSION)
          gh release create "$TAG" "dist/econtact-$V-firebee.zip" --target "$GITHUB_SHA" --title "EContact $V" \
            --notes-file "$RUNNER_TEMP/notes.md"
          gh release upload "$TAG" "dist/econtact-$V.zip"
          # the order as the API returns it (by name), which an old EUpdate unpacks in: no sorting here
          ORDER=$(gh api "repos/$GITHUB_REPOSITORY/releases/tags/$TAG" --jq '[.assets[].name] | join(" ")')
          echo "assets, as the API lists them: $ORDER"
          if [ "$ORDER" != "econtact-$V-firebee.zip econtact-$V.zip" ]; then
            echo "::error::the assets are $ORDER: the FireBee zip first and econtact-$V.zip last, nothing else"
            exit 1
          fi
